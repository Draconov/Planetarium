name: Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source
        run: npm run check
      - name: Build web app
        run: npm run build:web
      - name: Package web release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd dist/web
          zip -r "../Planetarium-${VERSION}-Web.zip" .
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planetarium-web
          path: |
            dist/web
            dist/Planetarium-*-Web.zip
          if-no-files-found: error

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows app
        run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Planetarium-Windows
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name != 'pull_request'
    needs: [web, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"
          echo "Release tag: ${TAG}"

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: Planetarium-web
          path: artifacts/web

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Planetarium-Windows
          path: artifacts/windows

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lah release-assets

      - name: Ensure existing release can be refreshed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IMMUTABLE="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isImmutable --jq '.isImmutable')"
            if [[ "${IMMUTABLE}" == "true" ]]; then
              echo "Release ${RELEASE_TAG} is immutable, so GitHub will not allow its tag or assets to be replaced." >&2
              echo "Disable immutable releases for this repository or increment package.json to publish a new version." >&2
              exit 1
            fi
          fi

      - name: Point version tag at this build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Moving ${RELEASE_TAG} to ${GITHUB_SHA}."
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            echo "Creating ${RELEASE_TAG} at ${GITHUB_SHA}."
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

      - name: Create or update published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_NOTES=$(cat <<EOF
          Automated published build of Planetarium ${RELEASE_VERSION}.

          Latest source commit: ${SHORT_SHA}
          Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}

          This release is refreshed automatically after every successful push to the default development branch while package.json remains on version ${RELEASE_VERSION}.
          EOF
          )

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Updating existing published release ${RELEASE_TAG}."
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Planetarium ${RELEASE_VERSION}" \
              --notes "${RELEASE_NOTES}" \
              --draft=false \
              --prerelease=false \
              --latest

            gh release upload "${RELEASE_TAG}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Creating published release ${RELEASE_TAG}."
            gh release create "${RELEASE_TAG}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Planetarium ${RELEASE_VERSION}" \
              --notes "${RELEASE_NOTES}" \
              --latest
          fi
