name: Build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update a GitHub Release using the version in package.json"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark a manually created release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source
        run: npm run check
      - name: Build web app
        run: npm run build:web
      - name: Package web release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd dist/web
          zip -r "../Planetarium-${VERSION}-Web.zip" .
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planetarium-web
          path: |
            dist/web
            dist/Planetarium-*-Web.zip
          if-no-files-found: error

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows app
        run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Planetarium-Windows
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [web, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
              echo "Tag ${TAG} does not match package.json version ${VERSION}." >&2
              echo "Update package.json or use the matching tag ${EXPECTED_TAG}." >&2
              exit 1
            fi
          else
            TAG="${EXPECTED_TAG}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"
          echo "Release tag: ${TAG}"

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: Planetarium-web
          path: artifacts/web

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Planetarium-Windows
          path: artifacts/windows

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lah release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          MANUAL_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; replacing attached build assets."
            gh release upload "${RELEASE_TAG}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            EXTRA_ARGS=()
            if [[ "${MANUAL_PRERELEASE}" == "true" ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi

            gh release create "${RELEASE_TAG}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Planetarium ${RELEASE_VERSION}" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi
